name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  # A release chama este workflow e só compila se ele passar
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Versão e componentes vêm do rust-toolchain.toml
      - name: Install Rust
        run: rustup toolchain install

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Os avisos mudam por alvo: os blocos cfg(windows)/cfg(mpris) só existem
      # em um ou outro. Ambas as combinações precisam ficar limpas.
      # (Localmente o alvo Windows é checado com x86_64-pc-windows-gnu; o msvc
      # de verdade precisa das ferramentas do Visual Studio, só existem aqui.)
      - name: clippy (todas as features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: clippy (sem features opcionais)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all-features

      - name: Test (sem features opcionais)
        run: cargo test --no-default-features
