name: CI

# Só no master (mais PRs): o dev chega ao master por fast-forward, então o
# mesmo commit era testado duas vezes. O master é o branch padrão, e o cache
# dele vale também para PRs e tags.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # A release chama este workflow quando o commit da tag ainda não tem CI verde
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # Incremental não ajuda em build do zero e só engorda o cache
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Versão e componentes vêm do rust-toolchain.toml
      - name: Install Rust
        run: rustup toolchain install

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev pkg-config

      # Um cache por sistema, salvo só pelo master: com um por job e por
      # branch (dev, master, tags) passava dos 10 GB do GitHub e era despejado
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Os avisos mudam por alvo: os blocos cfg(windows)/cfg(mpris) só existem
      # em um ou outro. Ambas as combinações precisam ficar limpas.
      # (Localmente o alvo Windows é checado com x86_64-pc-windows-gnu; o msvc
      # de verdade precisa das ferramentas do Visual Studio, só existem aqui.)
      - name: clippy (todas as features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: clippy (sem features opcionais)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Test (sem features opcionais)
        run: cargo test --no-default-features
