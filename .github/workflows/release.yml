name: Release

on:
  push:
    tags:
      - 'v*'
  # Rodar à mão (Actions → Release → Run workflow) testa os builds sem
  # publicar nada: o job "release" só roda em tag
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --all-features

      - name: Build
        run: cargo build --release

      - name: Rename binary
        run: |
          mkdir dist
          copy target\release\furinar.exe dist\furinar-windows-x86_64.exe
        shell: cmd

      # O Inno Setup costuma vir na imagem do runner; senão, Chocolatey. O
      # instalador baixado à mão travava o passo sem saída (Start-Process -Wait)
      - name: Install Inno Setup
        shell: pwsh
        timeout-minutes: 10
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe não encontrado" }
          Write-Output "Usando $($iscc.FullName)"
          "ISCC=$($iscc.FullName)" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          $versao = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $icone = (Get-ChildItem target\release\build -Recurse -Filter furinar.ico | Select-Object -First 1).FullName
          & "$env:ISCC" /Q "/DVersao=$versao" "/DExe=$PWD\target\release\furinar.exe" "/DIcone=$icone" pkg\windows\furinar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\furinar-windows-x86_64-setup.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/furinar-windows-x86_64.exe
            dist/furinar-windows-x86_64-setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev pkg-config

      - name: Test
        run: cargo test --all-features

      - name: Build
        run: cargo build --release

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf dist/furinar-linux-x86_64.tar.gz -C target/release furinar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/furinar-linux-x86_64.tar.gz

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      # O corpo da release é a seção desta versão no CHANGELOG: é o que o
      # aviso de atualização do app mostra (até o "## Downloads")
      - name: Release notes from CHANGELOG
        run: |
          versao="${GITHUB_REF_NAME#v}"
          awk -v v="$versao" 'index($0, "## [" v "]") == 1 { f = 1; next } f && /^## \[/ { exit } f' CHANGELOG.md > notas.md
          if ! grep -q '[^[:space:]]' notas.md; then
            echo "::error::CHANGELOG.md não tem a seção [$versao]"
            exit 1
          fi
          cat >> notas.md <<'EOF'

          ## Downloads
          - **Windows (installer):** `furinar-windows-x86_64-setup.exe` — installs for your user, no admin needed, with Start menu shortcut and uninstaller
          - **Windows (portable):** `furinar-windows-x86_64.exe` — just run it; settings stay next to it if you create an empty `furinar_config.json` there
          - **Linux:** `furinar-linux-x86_64.tar.gz`, or `curl -fsSL https://raw.githubusercontent.com/LokKol17/furinar/master/pkg/install.sh | bash`
          - `SHA256SUMS` — checksums of all files (the app and the installers verify them)

          Full history: [CHANGELOG.md](https://github.com/LokKol17/furinar/blob/master/CHANGELOG.md)
          EOF
          cat notas.md

      - name: Generate checksums
        run: |
          sha256sum windows/furinar-windows-x86_64-setup.exe windows/furinar-windows-x86_64.exe linux/furinar-linux-x86_64.tar.gz \
            | sed 's|  .*/|  |' > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Furinar - ${{ github.ref_name }}"
          body_path: notas.md
          files: |
            windows/furinar-windows-x86_64-setup.exe
            windows/furinar-windows-x86_64.exe
            linux/furinar-linux-x86_64.tar.gz
            SHA256SUMS
          draft: false
          prerelease: false
