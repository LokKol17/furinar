[package]
name = "furinar"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-winit-software",
    "raw-window-handle-06",
    "unstable-winit-030",
] }
rfd = "0.15"
rodio = { version = "0.19", features = ["mp3", "wav", "flac", "vorbis"] }
lofty = "0.25"
unicode-normalization = "0.1"
mp3-duration = "0.1"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
souvlaki = "0.8"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1"
# Só para gerar o .ico do executável a partir do PNG em ui/assets/
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
tauri-winres = "0.3"
