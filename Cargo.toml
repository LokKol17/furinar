[package]
name = "furinar"
version = "1.12.0"
edition = "2024"
license = "BSD-3-Clause"
description = "A light, fast, and beautiful audio player — inspired by the Hydro Archon"
repository = "https://github.com/LokKol17/furinar"

[package.metadata.deb]
maintainer = "Furinar Dev <dev@furinar.dev>"
copyright = "2026, Furinar Dev"
license-file = ["LICENSE", "0"]
assets = [
    ["target/release/furinar", "usr/bin/furinar", "755"],
    ["ui/assets/furinar_icon.png", "usr/share/icons/hicolor/256x256/apps/furinar.png", "644"],
    ["pkg/furinar.desktop", "usr/share/applications/furinar.desktop", "644"],
    ["pkg/furinar.metainfo.xml", "usr/share/metainfo/dev.furinar.furinar.metainfo.xml", "644"],
]
depends = "libasound2, libgtk-3-0 | libgtk-3-0t64"
section = "sound"
priority = "optional"

[features]
default = ["mpris"]
mpris = ["dep:souvlaki"]

[dependencies]
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-winit-software",
    "raw-window-handle-06",
    "unstable-winit-030",
] }
rfd = "0.15"
# default-features = false: pula "recording" (microfone), que não usamos.
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "mp3",
    "wav",
    "flac",
    "vorbis",
    # mp4 = symphonia-isomp4 + symphonia-aac: sem isto o symphonia não tem
    # container isomp4 nem codec AAC, e a faixa aparece na lista mas não toca.
    "mp4",
] }
lofty = "0.25"
unicode-normalization = "0.1"
mp3-duration = "0.1"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Fica no use_dbus padrão: o backend use_zbus abre conexão própria (+2 threads)
# e mantém uma thread acordando mesmo com o player pausado.
souvlaki = { version = "0.8", optional = true }
raw-window-handle = "0.6"
# default-features = false: pula o "reqwest/default-tls" (native-tls/openssl),
# que linkaria o binário em libssl do sistema. Com "rustls" a HTTPS sai toda
# em Rust, com as CAs embutidas (webpki-roots), sem dependência do OpenSSL.
self_update = { version = "0.41", default-features = false, features = [
    "archive-tar",
    "compression-flate2",
    "rustls",
] }
semver = "1"
# Conferência dos downloads de atualização (SHA256SUMS). Já entra na
# árvore por outras dependências.
sha2 = "0.10"
# Capa e fundos do modo imersivo. Já entra no build via Slint; aqui só somam
# os decodificadores de GIF/WebP.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
# FFT do visualizador do modo imersivo
rustfft = "6"
# Busca na web (letras, metadados, capas). O reqwest já entra pelo
# self_update com estas mesmas features: não soma nada ao binário.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
base64 = "0.22"
# Assinatura dos pedidos ao Last.fm
md5 = "0.7"
# "Ouvindo Furinar" no Discord (IPC local, sem rede)
discord-rich-presence = "1"
# Impressão digital do áudio (AcoustID), em Rust puro
rusty-chromaprint = "0.3"
# Relógio do modo imersivo (hora local). O Slint já compila o chrono com
# "clock"; aqui só ganhamos acesso a ele.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# madvise (memoria::aparar) e, na glibc, mallopt/malloc_trim
libc = "0.2"

[build-dependencies]
slint-build = "1"
# Só para gerar o .ico do executável a partir do PNG em ui/assets/
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
tauri-winres = "0.3"

# LTO + codegen-units=1 encolhem o .text, e com ele as páginas do binário que
# entram no RSS. panic fica como unwind: um panic numa thread de áudio não
# pode derrubar o player inteiro.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Dependências otimizadas também no `cargo run`: o renderer de software do
# Slint sem otimização leva ~140 ms por quadro em 1920x1080, e o modo
# imersivo cai para ~5 fps. O código do próprio furinar segue em opt-level 0,
# então a recompilação incremental continua rápida.
[profile.dev.package."*"]
opt-level = 3
